name: android-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-lint-release:
    name: unit-lint-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Debug unit tests, lint and Android-test compilation
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:compileDebugAndroidTestKotlin

      - name: Release unit tests and lint
        run: ./gradlew --no-daemon --stacktrace :app:testReleaseUnitTest :app:lintRelease

      - name: Create ephemeral CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore "${RUNNER_TEMP}/enigma-ci.jks" \
            -storepass "ci-only-password" \
            -keypass "ci-only-password" \
            -alias "enigma-ci" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 2 \
            -dname "CN=Enigma CI, OU=CI, O=Enigma, L=CI, C=FR"

      - name: Build debug and signed release paths
        env:
          ENIGMA_BASE_URL: https://relay-ci.example.invalid/
          ENIGMA_PINNED_HOST: relay-ci.example.invalid
          ENIGMA_PINNED_SHA256: sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ENIGMA_RELEASE_STORE_FILE: ${{ runner.temp }}/enigma-ci.jks
          ENIGMA_RELEASE_STORE_PASSWORD: ci-only-password
          ENIGMA_RELEASE_KEY_ALIAS: enigma-ci
          ENIGMA_RELEASE_KEY_PASSWORD: ci-only-password
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify release APK signatures
        run: |
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            echo "Verifying ${apk}"
            "${APKSIGNER}" verify --verbose "${apk}"
          done

      - name: Verify Room schema snapshots are committed
        run: |
          status="$(git status --porcelain -- app/schemas)"
          if [[ -n "${status}" ]]; then
            echo "Room schema snapshots changed or are untracked:"
            echo "${status}"
            echo "Commit the generated Room schema before merging."
            exit 1
          fi

      - name: Upload Android CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ci-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            android/app/build/reports/**
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/schemas/**

  instrumentation:
    name: instrumentation-api-${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented migration and UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          working-directory: ./android
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumentation-api-${{ matrix.api-level }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**

  dependency-snapshot:
    name: gradle-dependency-snapshot
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Detect GitHub Dependency Graph
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl --silent --output /tmp/enigma-sbom.json --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom")"
          if [[ "${code}" == "200" ]]; then
            echo "mode=generate-and-submit" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=generate" >> "${GITHUB_OUTPUT}"
            echo "::warning::GitHub Dependency Graph is disabled; generating the Gradle snapshot locally. Enable Settings > Security > Code security > Dependency graph to activate submission and blocking dependency review."
          fi

      - name: Generate Gradle dependency graph
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: ${{ steps.dependency-graph.outputs.mode }}
          dependency-graph-continue-on-failure: false
          validate-wrappers: true

      - name: Resolve dependencies
        run: ./gradlew --no-daemon :app:dependencies
