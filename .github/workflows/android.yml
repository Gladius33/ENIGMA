name: android-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/check-android.sh"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/check-android.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-lint-release:
    name: unit-lint-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Debug and release unit tests, lint, Android-test compilation
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:lintDebug \
            :app:lintRelease \
            :app:compileDebugAndroidTestKotlin

      - name: Create ephemeral CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore "${RUNNER_TEMP}/enigma-ci.jks" \
            -storepass "ci-only-password" \
            -keypass "ci-only-password" \
            -alias "enigma-ci" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 2 \
            -dname "CN=Enigma CI, OU=CI, O=Enigma, L=CI, C=FR"

      - name: Build debug and signed release paths
        env:
          ENIGMA_BASE_URL: https://relay-ci.example.invalid/
          ENIGMA_PINNED_HOST: relay-ci.example.invalid
          ENIGMA_PINNED_SHA256: sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ENIGMA_RELEASE_STORE_FILE: ${{ runner.temp }}/enigma-ci.jks
          ENIGMA_RELEASE_STORE_PASSWORD: ci-only-password
          ENIGMA_RELEASE_KEY_ALIAS: enigma-ci
          ENIGMA_RELEASE_KEY_PASSWORD: ci-only-password
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify release APK signatures
        run: |
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            echo "Verifying ${apk}"
            "${APKSIGNER}" verify --verbose "${apk}"
          done

      - name: Verify Room schema snapshots are committed
        run: |
          status="$(git status --porcelain -- app/schemas)"
          if [[ -n "${status}" ]]; then
            echo "Room schema snapshots changed or are untracked:"
            echo "${status}"
            echo "Commit the generated Room schema before merging."
            exit 1
          fi

      - name: Upload Android CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-ci-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            android/app/build/reports/**
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/schemas/**

  instrumentation:
    name: instrumentation-api-${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented migration and UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          working-directory: ./android
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-instrumentation-api-${{ matrix.api-level }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**

  dependency-snapshot:
    name: gradle-dependency-snapshot
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate and submit Gradle dependency graph
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
          validate-wrappers: true

      - name: Resolve dependencies
        run: ./gradlew --no-daemon :app:dependencies
