name: refresh-derived-ci

on:
  push:
    branches: [ci/max-hardening]
    paths:
      - "server/Cargo.toml"
      - ".github/workflows/refresh-derived-ci.yml"

permissions:
  contents: write

concurrency:
  group: refresh-derived-ci
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CI branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/max-hardening
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      - name: Refresh Rust lockfile
        working-directory: server
        run: cargo update

      - name: Generate current Room schema serially
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:kspDebugKotlin

      - name: Commit derived dependency/schema state
        run: |
          git add server/Cargo.lock android/app/schemas
          if git diff --cached --quiet; then
            echo "Derived files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh audited dependency and Room schema state"
          git push origin HEAD:ci/max-hardening
