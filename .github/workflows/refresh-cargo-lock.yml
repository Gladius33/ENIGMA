name: refresh-cargo-lock

on:
  push:
    branches: [ci/max-hardening]
    paths:
      - "server/Cargo.toml"
      - ".github/workflows/refresh-cargo-lock.yml"

permissions:
  contents: write

concurrency:
  group: refresh-cargo-lock
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CI branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/max-hardening
          fetch-depth: 0

      - name: Refresh Cargo.lock
        working-directory: server
        run: cargo update

      - name: Commit refreshed lockfile
        run: |
          git add server/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Cargo lockfile after security dependency pruning"
          git push origin HEAD:ci/max-hardening
