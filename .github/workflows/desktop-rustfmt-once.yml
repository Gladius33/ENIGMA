name: desktop-rustfmt-once

on:
  push:
    branches:
      - feat/desktop-multidevice-p2p-1.0

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/desktop-multidevice-p2p-1.0
          fetch-depth: 0

      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          rustfmt +1.94.1 --version

      - name: Format desktop workspace
        working-directory: desktop
        run: cargo +1.94.1 fmt --all

      - name: Commit rustfmt output only
        shell: bash
        run: |
          if git diff --quiet -- desktop; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- desktop
          git commit -m "style(desktop): apply rustfmt 1.94.1"
          git push origin HEAD:feat/desktop-multidevice-p2p-1.0
