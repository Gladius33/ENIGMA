name: maintenance-branch-cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'Gladius33/ENIGMA'
    runs-on: ubuntu-latest
    steps:
      - name: Delete non-main branches without open pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "enigma-maintenance",
          }

          def get_json(path):
              req = urllib.request.Request(api + path, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          open_heads = set()
          page = 1
          while True:
              pulls = get_json(f"/repos/{repo}/pulls?state=open&per_page=100&page={page}")
              if not pulls:
                  break
              for pull in pulls:
                  head = pull.get("head") or {}
                  head_repo = (head.get("repo") or {}).get("full_name")
                  head_ref = head.get("ref")
                  if head_repo == repo and head_ref:
                      open_heads.add(head_ref)
              if len(pulls) < 100:
                  break
              page += 1

          branches = []
          page = 1
          while True:
              batch = get_json(f"/repos/{repo}/branches?per_page=100&page={page}")
              if not batch:
                  break
              branches.extend(item["name"] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          stale = sorted(
              branch for branch in branches
              if branch != "main" and branch not in open_heads
          )

          print("Open PR heads kept:", sorted(open_heads))
          print("Branches to delete:", stale)

          for branch in stale:
              encoded = urllib.parse.quote(branch, safe="")
              req = urllib.request.Request(
                  f"{api}/repos/{repo}/git/refs/heads/{encoded}",
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      response.read()
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise SystemExit(
                      f"Failed deleting {branch}: HTTP {exc.code}: {body}"
                  )
              print(f"Deleted: {branch}")
          PY
