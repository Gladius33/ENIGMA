name: supply-chain-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar --prefix="enigma-${GITHUB_SHA}/" HEAD | gzip -n > "enigma-source-${GITHUB_SHA}.tar.gz"
          sha256sum "enigma-source-${GITHUB_SHA}.tar.gz" > source.sha256

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: enigma.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM fail-closed
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("enigma.spdx.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("SBOM missing or empty")
          doc = json.loads(path.read_text(encoding="utf-8"))
          if not str(doc.get("spdxVersion", "")).startswith("SPDX-"):
              raise SystemExit("invalid SPDX version")
          if not doc.get("packages"):
              raise SystemExit("SBOM contains no packages")
          if not doc.get("documentNamespace"):
              raise SystemExit("SBOM has no document namespace")

      - name: Upload source archive and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enigma-supply-chain-${{ github.sha }}
          path: |
            enigma-source-${{ github.sha }}.tar.gz
            source.sha256
            enigma.spdx.json
          if-no-files-found: error
          retention-days: 30

  attest:
    name: source-sbom-attestation
    needs: sbom
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download supply-chain artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: enigma-supply-chain-${{ github.sha }}

      - name: Attest source archive with SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: enigma-source-${{ github.sha }}.tar.gz
          sbom-path: enigma.spdx.json
