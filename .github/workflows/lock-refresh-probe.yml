name: lock-refresh-probe

on:
  push:
    branches:
      - feat/desktop-multidevice-p2p-1.0

permissions:
  contents: read

jobs:
  regenerate-server-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore last green server lock
        run: git show 8447c8eb7b2e52758842efcbe7a43b501b0455ff:server/Cargo.lock > server/Cargo.lock

      - name: Install project Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          cargo +1.94.1 --version

      - name: Regenerate rustls lock entry with Cargo
        working-directory: server
        run: cargo +1.94.1 update -p rustls --precise 0.23.45

      - name: Upload regenerated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regenerated-server-lock
          path: server/Cargo.lock
          if-no-files-found: error
          retention-days: 1
