name: lock-refresh-probe

on:
  push:
    branches:
      - feat/desktop-multidevice-p2p-1.0

permissions:
  contents: write

jobs:
  regenerate-server-lock:
    if: github.actor == 'Gladius33'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore last green server lock
        run: git show 8447c8eb7b2e52758842efcbe7a43b501b0455ff:server/Cargo.lock > server/Cargo.lock

      - name: Install project Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          cargo +1.94.1 --version

      - name: Regenerate rustls lock entry with Cargo
        working-directory: server
        run: cargo +1.94.1 update -p rustls --precise 0.23.45

      - name: Commit regenerated lock and remove probe
        run: |
          rm .github/workflows/lock-refresh-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/Cargo.lock .github/workflows/lock-refresh-probe.yml
          git diff --cached --check
          git commit -m 'fix(security): regenerate rustls lock with Cargo'
          git push origin HEAD:feat/desktop-multidevice-p2p-1.0
