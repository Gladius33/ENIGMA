services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enigma
      POSTGRES_USER: enigma
      POSTGRES_PASSWORD: enigma_dev_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enigma -d enigma"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin123
        mc mb -p local/enigma-attachments || true

  coturn:
    image: coturn/coturn:4.6-alpine
    command:
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=turn_dev_shared_secret
      - --realm=enigma.local
      - --no-cli
      - --no-tls
      - --no-dtls
    ports:
      - "${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_PORT:-3478}:3478/udp"

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://enigma:enigma_dev_password@postgres:5432/enigma
      DATABASE_MAX_CONNECTIONS: 10
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-change-me-change-me-change-me
      JWT_ACCESS_TTL_SECONDS: 3600
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
      MAX_JSON_BODY_BYTES: 1048576
      MAX_CIPHERTEXT_BYTES: 262144
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_MAX_REQUESTS: 120
      MESSAGE_TTL_SECONDS: 604800
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin123
      S3_BUCKET: enigma-attachments
      S3_FORCE_PATH_STYLE: "true"
      S3_UPLOAD_PRESIGN_TTL_SECONDS: 900
      S3_DOWNLOAD_PRESIGN_TTL_SECONDS: 900
      ATTACHMENT_TTL_SECONDS: 604800
      MAX_ATTACHMENT_BYTES: 104857600
      TURN_SHARED_SECRET: turn_dev_shared_secret
      TURN_REALM: enigma.local
      TURN_CREDENTIAL_TTL_SECONDS: 600
      TURN_URIS: turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp
      RUST_LOG: enigma_e2ee_server=info,tower_http=info
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
  redis-data:
  minio-data:
